<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#083b2d" />
  <title>Track My Booking — Room Rentals</title>
  <meta name="description" content="Check the status of your room booking with your reference code." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="mark">⌂</span> <span id="brand-name">Room Rentals</span></a>
      <nav class="nav">
        <a href="index.html">Rooms</a>
        <a href="track.html">Track booking</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div id="config-warning"></div>
    <section class="section" style="max-width: 640px; margin: 0 auto;">
      <p class="eyebrow">Booking status</p>
      <h2>Track my booking</h2>
      <p class="sub">Enter the booking reference code from your confirmation and the email you booked with.</p>

      <div class="panel">
        <form id="track-form">
          <div class="field">
            <label for="t-ref">Booking reference code</label>
            <input id="t-ref" required autocomplete="off" placeholder="e.g. A3F9C2D1" style="text-transform: uppercase; letter-spacing: 2px; font-weight: 700;" />
          </div>
          <div class="field">
            <label for="t-email">Email you booked with</label>
            <input id="t-email" type="email" required autocomplete="email" placeholder="you@example.com" />
          </div>
          <div id="track-error"></div>
          <button class="btn" type="submit" id="track-btn">Check status</button>
        </form>
      </div>

      <div id="track-result" style="margin-top: 28px;"></div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div>
        <p><strong id="foot-name">Room Rentals</strong></p>
        <p id="foot-contact"></p>
      </div>
      <div>
        <p><a href="admin.html">Owner login</a></p>
      </div>
    </div>
  </footer>

  <script type="module" src="js/track.js"></script>
</body>
</html>
